name: Compile Bob firmware
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M
          platforms: |
            - name: esp32:esp32
              version: 3.3.0
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: GFX Library for Arduino
              version: 1.6.0
          sketch-paths: |
            - firmware/bob
          enable-warnings-report: true
  dream-matches-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firmware dreams draw the same pixels as sim/dream.js
        working-directory: firmware/dream_check
        run: g++ -O2 -Wall -o dream_check dream_check.cpp && ./dream_check > fw.bin && node compare.js fw.bin
