name: Compile Bob firmware
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: GFX Library for Arduino
          sketch-paths: |
            - firmware/bob
          enable-warnings-report: true
