<!doctype html>
<html><head><meta charset="utf-8"><title>bob body render</title>
<style>html,body{margin:0;background:#F4EBDD;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// view: #iso (front-left), #back (back-right), #open (head lifted)
const view = location.hash.slice(1) || 'iso';
const W = 1600, H = 1200;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#F4EBDD');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.up = new THREE.Vector3(0, 0, 1);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-60, -90, 160); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 1, far: 500 });
scene.add(sun); scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.position.set(40, 35, -0.01); floor.receiveShadow = true; scene.add(floor);

const shellMat = new THREE.MeshPhysicalMaterial({ color: '#EADBC4', roughness: 0.55, clearcoat: 0.2 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: '#EADBC4', roughness: 0.4, transparent: true, opacity: 0.32, depthWrite: false, side: THREE.DoubleSide });

const stl = new STLLoader();
const load = (u) => new Promise((res, rej) => stl.load(u, res, undefined, rej));
const [baseG, headG] = await Promise.all([load('../shell/bob-base.stl'), load('../shell/bob-head.stl')]);
baseG.computeVertexNormals(); headG.computeVertexNormals();
const base = new THREE.Mesh(baseG, shellMat); base.castShadow = base.receiveShadow = true; scene.add(base);
const head = new THREE.Mesh(headG, glassMat); head.position.z = view === 'open' ? 25 + 40 : 25; scene.add(head);
const headEdges = new THREE.LineSegments(new THREE.EdgesGeometry(headG, 30), new THREE.LineBasicMaterial({ color: '#8A6F5C', transparent: true, opacity: 0.7 }));
headEdges.position.copy(head.position); scene.add(headEdges);

// the real board (KiCad GLB, metres, Y-up) -> mm, Z-up, sitting on the 5 mm posts
const gltf = await new Promise((res, rej) => new GLTFLoader().load('bob-board.glb', res, undefined, rej));
const board = gltf.scene;
board.scale.setScalar(1000); board.rotation.x = Math.PI / 2;
board.updateMatrixWorld(true);
let box = new THREE.Box3().setFromObject(board);
const c = box.getCenter(new THREE.Vector3());
board.position.x += 40.5 - c.x; board.position.y += 35.25 - c.y; board.position.z += 7 - box.min.z + 0.0;
board.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(board);
board.updateMatrixWorld(true); box = new THREE.Box3().setFromObject(board);
// lift so the board's underside (not components below) rests on the posts: use the thickest flat layer near min z
document.title = 'board z ' + box.min.z.toFixed(1) + '..' + box.max.z.toFixed(1);

const cam = new THREE.PerspectiveCamera(32, W / H, 1, 2000); cam.up.set(0, 0, 1);
const target = new THREE.Vector3(40.5, 35, view === 'open' ? 38 : 26);
const pos = { iso: [-95, -150, 135], back: [190, 210, 140], open: [-110, -165, 150] }[view];
cam.position.set(...pos); cam.lookAt(target);
renderer.render(scene, cam);
document.body.dataset.done = '1';
</script>
</body></html>
